[project]
name = "a-ponte"
version = "1.0.0"
description = "Servidor MCP de salas e agente A2A que o consome por dentro."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
